<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Chalo</title><link rel="stylesheet" href="css/stylescommon.css"><link rel="stylesheet" href="css/styleslogin.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><img src="assets/chalo-logo.png" class="brand-logo" alt="" onerror="this.style.display='none'"><span>চলো <small>Chalo</small></span></a><nav class="main-nav"><a href="index.html">Home</a><a href="gift-booking.html">Gift</a><a href="index.html#about">About</a></nav><div class="header-actions"><a class="login-link" href="login.html">Log in</a><a class="register-btn" href="register.html">Register</a></div></div></header><main class="auth-main"><div class="auth-layout" style="max-width:620px;grid-template-columns:1fr"><section class="login-card" style="min-height:0"><p class="card-eyebrow">START YOUR NEXT JOURNEY</p><h2>Create your account.</h2><p class="card-description">One account for your bookings, e-tickets and gifts.</p><form id="registerForm"><div class="form-group"><label for="name">Full name *</label><div class="input-wrap"><input id="name" name="full_name" required placeholder="Enter your full name" autocomplete="name"></div></div><div class="form-group"><label for="email">Email address *</label><div class="input-wrap"><input id="email" name="email" type="email" required placeholder="Enter your email" autocomplete="email"></div></div><div class="form-group"><label for="phone">Bangladesh phone number *</label><div class="input-wrap"><input id="phone" name="phone" type="tel" required pattern="[+]?[0-9 -]{8,16}" placeholder="01XXXXXXXXX" autocomplete="tel"></div></div><div class="form-group"><label for="newPassword">Password *</label><div class="input-wrap"><input id="newPassword" name="password" type="password" minlength="8" required placeholder="At least 8 characters" autocomplete="new-password"></div></div><button class="primary-button" type="submit">Create account <span>→</span></button><p class="form-feedback" id="registerFeedback" role="status"></p></form><p class="create-account">Already have an account? <a href="login.html">Log in</a></p><p class="secure-note">Your details are protected. Passwords are securely hashed.</p></section></div></main><script src="js/auth-nav.js" defer></script><script src="js/register.js" defer></script></body></html>
